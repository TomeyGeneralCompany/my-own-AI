name: English comprehension production trial
on:
  pull_request:
    paths:
      - 'my_own_ai/comprehension*.py'
      - 'my_own_ai/language_training.py'
      - 'scripts/ancestor_staged.py'
      - 'tests/test_comprehension_cycles.py'
      - 'tests/test_intellectual_memory.py'
      - 'my_own_ai/intellectual_memory.py'
      - 'my_own_ai/language_inference.py'
      - '.github/workflows/comprehension-trial.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: comprehension-trial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-comprehension:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original CPU model
        run: |
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Restore verified live checkpoint into isolated trial
        run: |
          set -euo pipefail
          mkdir -p data/restore data/trial
          TAG="ancestor-stage-progress-$(sha256sum published_books/manifest.json | cut -c1-12)"
          ASSET="$(python scripts/stage_checkpoint_storage.py latest --repo "$GITHUB_REPOSITORY" --tag "$TAG")"
          gh release download "$TAG" --pattern "$ASSET" --dir data/restore
          python scripts/ancestor_staged.py unpack --archive "data/restore/$ASSET" --state data/trial
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/trial")
          ledger=json.loads((p/"stage-ledger.json").read_text())
          assert ledger["stage"]=="english" and ledger["english_fundamentals_passed"]
          assert (p/"english.pt").exists()
          baseline=json.loads((p/"last-exam.json").read_text())
          Path("data/baseline.json").write_text(json.dumps(baseline))
          print("Baseline exact score:",baseline["exact_correct"])
          PY
      - name: Train and examine across two full comprehension cycles
        run: |
          set -euo pipefail
          for i in 1 2; do
            python -u scripts/ancestor_staged.py train --repository . --state data/trial --scratch "data/trial-scratch-$i" --parent-generation g0002 --english-updates 1 | tee "data/trial-result-$i.json"
            cp data/trial/last-exam.json "data/exam-$i.json"
            cp data/trial/comprehension-diagnostics.json "data/retention-$i.json"
            python - "$i" <<'PY'
          import json,sys
          i=sys.argv[1]
          d=json.load(open("data/retention-"+i+".json"))
          assert d["curriculum_cycles"]>=int(i)
          assert d["prior_comparable"]==130
          print(json.dumps({k:d[k] for k in ("correct","previous_correct","retained","lost","gained","validation_loss","learning_rate","categories")},indent=2))
          PY
            if python -c 'import json,sys;sys.exit(0 if json.load(open("data/trial/stage-ledger.json"))["stage"]!="english" else 1)'; then break; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comprehension-trial-${{ github.run_id }}
          path: |
            data/baseline.json
            data/trial-result-*.json
            data/exam-*.json
            data/retention-*.json
          retention-days: 30
