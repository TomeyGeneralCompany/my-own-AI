name: English comprehension production trial
on:
  pull_request:
    paths:
      - 'my_own_ai/comprehension*.py'
      - 'my_own_ai/language_training.py'
      - 'scripts/ancestor_staged.py'
      - 'tests/test_comprehension_cycles.py'
      - 'tests/test_intellectual_memory.py'
      - 'my_own_ai/intellectual_memory.py'
      - 'my_own_ai/language_inference.py'
      - '.github/workflows/comprehension-trial.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: comprehension-trial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-comprehension:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original CPU model
        run: |
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Restore verified live checkpoint into isolated trial
        run: |
          set -euo pipefail
          mkdir -p data/restore data/trial
          TAG="ancestor-stage-progress-$(sha256sum published_books/manifest.json | cut -c1-12)"
          ASSET="$(python scripts/stage_checkpoint_storage.py latest --repo "$GITHUB_REPOSITORY" --tag "$TAG")"
          gh release download "$TAG" --pattern "$ASSET" --dir data/restore
          python scripts/ancestor_staged.py unpack --archive "data/restore/$ASSET" --state data/trial
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/trial")
          ledger=json.loads((p/"stage-ledger.json").read_text())
          assert ledger["stage"]=="english" and ledger["english_fundamentals_passed"]
          assert (p/"english.pt").exists()
          baseline=json.loads((p/"last-exam.json").read_text())
          Path("data/baseline.json").write_text(json.dumps(baseline))
          assert baseline["format"]=="english_mastery_v1"
          assert baseline["checkpoint_sha256"] == __import__("hashlib").sha256((p/"english.pt").read_bytes()).hexdigest()
          print("Baseline mastery:",baseline["passed_items"])
          PY
      - name: Continue and independently examine the current mastery checkpoint
        run: |
          set -euo pipefail
          python scripts/independent_mastery_trial.py --state data/trial --repository . --output data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comprehension-trial-${{ github.run_id }}
          path: |
            data/baseline.json
            data/trial-result-*.json
            data/exam-*.json
            data/retention-*.json
          retention-days: 30
