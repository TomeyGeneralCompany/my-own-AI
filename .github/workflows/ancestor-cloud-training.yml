name: Ancestor off-laptop training
# Published manuscripts permitted by the author. No private data repository or PAT.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
concurrency:
  group: ancestor-cloud-training
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      ANCESTOR_RESUME: ''
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original neural model
        run: python -m pip install -e .
      - name: Locate author-approved public corpus release
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view ancestor-training-inputs --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Author-approved public training release not found; skipping training."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/ancestor-inputs"
          for asset in ancestor_private_training_library.zip governance.json tokenizer.json heldout.txt; do
            gh release download ancestor-training-inputs --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP/ancestor-inputs"
            test -s "$RUNNER_TEMP/ancestor-inputs/$asset"
          done
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Verify and import all eleven published manuscripts
        if: ${{ steps.inputs.outputs.available == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m ancestor.cli import-private-library --bundle "$RUNNER_TEMP/ancestor-inputs/ancestor_private_training_library.zip" --data "$RUNNER_TEMP/ancestor-library"
      - name: Restore latest SHA-256 verified Actions checkpoint
        if: ${{ steps.inputs.outputs.available == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ancestor-recovery"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&name=ancestor-neural-checkpoint" --jq '.artifacts[] | select(.expired == false) | .id' > "$RUNNER_TEMP/ancestor-artifact-ids.txt"
          if [ ! -s "$RUNNER_TEMP/ancestor-artifact-ids.txt" ]; then
            echo "No previous artifact. Initializing model from fresh random weights."
            exit 0
          fi
          while read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            rm -f "$RUNNER_TEMP/ancestor-recovery/latest.pt" "$RUNNER_TEMP/ancestor-recovery/latest.json"
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/candidate.zip" \
               && unzip -oq "$RUNNER_TEMP/candidate.zip" -d "$RUNNER_TEMP/ancestor-recovery" \
               && python -c 'from ancestor.remote_checkpoints import checkpoint_metadata; import sys; sys.exit(0 if checkpoint_metadata(sys.argv[1]) else 1)' "$RUNNER_TEMP/ancestor-recovery"; then
              echo "ANCESTOR_RESUME=$RUNNER_TEMP/ancestor-recovery/latest.pt" >> "$GITHUB_ENV"
              echo "Verified recovery from artifact $artifact_id."
              exit 0
            fi
          done < "$RUNNER_TEMP/ancestor-artifact-ids.txt"
          echo "Prior checkpoints exist but no valid recovery state is available."
          exit 1
      - name: Continue axiom-conditioned neural training
        if: ${{ steps.inputs.outputs.available == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --data "$RUNNER_TEMP/ancestor-library"
            --tokenizer "$RUNNER_TEMP/ancestor-inputs/tokenizer.json"
            --governance "$RUNNER_TEMP/ancestor-inputs/governance.json"
            --heldout "$RUNNER_TEMP/ancestor-inputs/heldout.txt"
            --output "$RUNNER_TEMP/ancestor-trained"
            --block 1024 --width 384 --layers 6 --heads 6 --ffn 1536
            --updates 50000 --max-minutes 200
          )
          if [ -n "$ANCESTOR_RESUME" ]; then
            args+=(--resume "$ANCESTOR_RESUME")
          fi
          python -m ancestor.cloud_training "${args[@]}"
      - name: Persist neural weights optimizer and RNG state
        if: ${{ steps.inputs.outputs.available == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ancestor-neural-checkpoint
          path: |
            ${{ runner.temp }}/ancestor-trained/latest.pt
            ${{ runner.temp }}/ancestor-trained/latest.json
            ${{ runner.temp }}/ancestor-trained/summary.json
          retention-days: 90
          if-no-files-found: error
