name: Ancestor off-laptop training
# Public book extracts are included in the repository by the rights holder.
# Run on trusted main only; never give training artifacts to untrusted PR code.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - published_library/**
      - ancestor/public_library.py
      - ancestor/public_training_setup.py
      - ancestor/cloud_training.py
      - .github/workflows/ancestor-cloud-training.yml
  schedule:
    - cron: '17 */6 * * *'
concurrency:
  group: ancestor-cloud-training
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      ANCESTOR_RESUME: ''
    steps:
      - name: Checkout original model and all eleven published book texts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original neural model
        run: python -m pip install -e .
      - name: Verify and index every published manuscript
        shell: bash
        run: |
          set -euo pipefail
          python -m ancestor.public_library --source published_library \
            --data "$RUNNER_TEMP/ancestor-library"
      - name: Prepare stable owner-governed training inputs
        shell: bash
        run: |
          set -euo pipefail
          python -m ancestor.public_training_setup \
            --data "$RUNNER_TEMP/ancestor-library" \
            --out "$RUNNER_TEMP/ancestor-inputs"
      - name: Restore latest SHA-256 verified Actions checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ancestor-recovery"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&name=ancestor-neural-checkpoint" \
            --jq '.artifacts[] | select(.expired == false) | .id' > "$RUNNER_TEMP/ancestor-artifact-ids.txt"
          if [ ! -s "$RUNNER_TEMP/ancestor-artifact-ids.txt" ]; then
            echo "Initial owner-governed training session; no prior checkpoint."
            exit 0
          fi
          while read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            rm -f "$RUNNER_TEMP/ancestor-recovery/latest.pt" "$RUNNER_TEMP/ancestor-recovery/latest.json"
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/candidate.zip" \
               && unzip -oq "$RUNNER_TEMP/candidate.zip" -d "$RUNNER_TEMP/ancestor-recovery" \
               && python -c 'from ancestor.remote_checkpoints import checkpoint_metadata; import sys; sys.exit(0 if checkpoint_metadata(sys.argv[1]) else 1)' "$RUNNER_TEMP/ancestor-recovery"; then
              echo "ANCESTOR_RESUME=$RUNNER_TEMP/ancestor-recovery/latest.pt" >> "$GITHUB_ENV"
              echo "Verified continuity with cloud artifact $artifact_id."
              exit 0
            fi
          done < "$RUNNER_TEMP/ancestor-artifact-ids.txt"
          echo "Prior checkpoints found but none passed integrity verification."
          exit 1
      - name: Train original Ancestor from all eleven works
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --data "$RUNNER_TEMP/ancestor-library"
            --tokenizer "$RUNNER_TEMP/ancestor-inputs/tokenizer.json"
            --governance "$RUNNER_TEMP/ancestor-inputs/governance.json"
            --heldout "$RUNNER_TEMP/ancestor-inputs/heldout.txt"
            --output "$RUNNER_TEMP/ancestor-trained"
            --block 1024 --width 384 --layers 6 --heads 6 --ffn 1536
            --updates 50000 --max-minutes 200
          )
          if [ -n "$ANCESTOR_RESUME" ]; then
            args+=(--resume "$ANCESTOR_RESUME")
          fi
          python -m ancestor.cloud_training "${args[@]}"
      - name: Retain trained neural weights and full recovery state
        uses: actions/upload-artifact@v4
        with:
          name: ancestor-neural-checkpoint
          path: |
            ${{ runner.temp }}/ancestor-trained/latest.pt
            ${{ runner.temp }}/ancestor-trained/latest.json
            ${{ runner.temp }}/ancestor-trained/summary.json
          retention-days: 90
          if-no-files-found: error
