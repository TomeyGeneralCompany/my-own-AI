name: Train Ancestor Core — autonomous numbered-paragraph reading

on:
  workflow_dispatch:
    inputs:
      generation:
        description: 'Persistent generation to train/resume'
        required: true
        default: 'g0001'
        type: string
      reading_passes:
        description: 'Cumulative complete passes through approved book paragraphs'
        required: true
        default: '5'
        type: string
      instruction_steps:
        description: 'Cumulative instruction updates after full reading passes'
        required: true
        default: '600'
        type: string
      session_seconds:
        description: 'CPU training seconds per Actions session (60–2250)'
        required: true
        default: '2100'
        type: string
      curriculum:
        description: 'Instruction learning objective: reasoning for g0002, continuation for legacy g0001'
        required: true
        default: 'continuation'
        type: choice
        options: [continuation, reasoning, english_grounded]
      parent_generation:
        description: 'Explicit completed parent candidate generation (empty for g0001)'
        required: false
        default: ''
        type: string
      auto_continue:
        description: 'Queue the next session automatically until candidate is complete'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: ancestor-training-${{ inputs.generation }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
      GENERATION: ${{ inputs.generation }}
      READING_PASSES: ${{ inputs.reading_passes }}
      INSTRUCTION_STEPS: ${{ inputs.instruction_steps }}
      SESSION_SECONDS: ${{ inputs.session_seconds }}
      AUTO_CONTINUE: ${{ inputs.auto_continue }}
      CURRICULUM: ${{ inputs.curriculum }}
      PARENT_GENERATION: ${{ inputs.parent_generation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original CPU neural runtime
        run: |
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Validate campaign and exact published paragraph corpus
        run: |
          python - <<'PY'
          import os,re
          from my_own_ai.published_corpus import validate_published_manifest
          assert re.fullmatch(r'g[0-9]{4}',os.environ["GENERATION"])
          for name in ("READING_PASSES","INSTRUCTION_STEPS"):
              assert os.environ[name].isdecimal() and 1 <= int(os.environ[name]) <= 10000
          assert os.environ["CURRICULUM"] in ("continuation","reasoning","english_grounded")
          if os.environ["GENERATION"]=="g0001":
              assert os.environ["CURRICULUM"]=="continuation"
              assert not os.environ["PARENT_GENERATION"]
          else:
              assert os.environ["PARENT_GENERATION"] and re.fullmatch(r'g[0-9]{4}',os.environ["PARENT_GENERATION"])
              assert int(os.environ["PARENT_GENERATION"][1:])<int(os.environ["GENERATION"][1:])
          assert os.environ["SESSION_SECONDS"].isdecimal()
          assert 60 <= int(os.environ["SESSION_SECONDS"]) <= 2250
          approved=validate_published_manifest(".","published_books/manifest.json")
          assert approved["sources"]
          print("Approved works:",len(approved["sources"]))
          print("Corpus:",approved["corpus_id"])
          PY
      - name: Restore durable training state or active ancestral checkpoint
        run: |
          set -euo pipefail
          mkdir -p data/download data/ancestor-state
          TAG="ancestor-progress-${GENERATION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            ASSET="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '[.assets[] | select(.name | startswith("ancestor-state-"))] | sort_by(.created_at) | last | .name')"
            if [ -z "$ASSET" ] || [ "$ASSET" = null ]; then
              echo 'Progress release contains no restore point'; exit 1
            fi
            gh release download "$TAG" --pattern "$ASSET" --dir data/download
            python scripts/ancestor_core.py unpack --archive "data/download/$ASSET" --state data/ancestor-state --generation "$GENERATION"
            echo "Restored $ASSET" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$GENERATION" != g0001 ]; then
            ANCESTOR_TAG="ancestor-${PARENT_GENERATION}-candidate"
            gh release download "$ANCESTOR_TAG" --pattern core-generation.zip --dir data/download
            python scripts/ancestor_core.py unpack --archive data/download/core-generation.zip --state data/ancestor-parent --generation "$PARENT_GENERATION"
            echo "PARENT_STATE=data/ancestor-parent" >> "$GITHUB_ENV"
          fi
      - name: Continuously read numbered paragraphs, keep equations, then instruction-tune
        run: |
          set -euo pipefail
          PARENT_ARGS=()
          if [ -n "${PARENT_STATE:-}" ]; then PARENT_ARGS=(--parent-state "$PARENT_STATE"); fi
          python -u scripts/ancestor_core.py train \
            --repository . --state data/ancestor-state --scratch data/session \
            --generation "$GENERATION" --curriculum "$CURRICULUM" --passes "$READING_PASSES" \
            --instruction-steps "$INSTRUCTION_STEPS" \
            --max-session-seconds "$SESSION_SECONDS" \
            "${PARENT_ARGS[@]}" | tee data/session-report.json
      - name: Package a verifiable durable resume point
        run: |
          set -euo pipefail
          python scripts/ancestor_core.py pack --state data/ancestor-state --archive data/core-state.zip > data/package-report.json
          cat data/package-report.json
      - name: Publish unique immutable progress snapshot
        run: |
          set -euo pipefail
          TAG="ancestor-progress-${GENERATION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Ancestor Core progress ${GENERATION}" \
              --notes "Immutable checkpoints from automatic numbered-paragraph reading." --prerelease
          fi
          ASSET="ancestor-state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          cp data/core-state.zip "data/$ASSET"
          gh release upload "$TAG" "data/$ASSET"
          echo "Saved persistent resume point $ASSET" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish completed model as an immutable candidate
        run: |
          set -euo pipefail
          PHASE="$(python -c 'import json;print(json.load(open("data/ancestor-state/generation.json"))["phase"])')"
          echo "Phase after this session: $PHASE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PHASE" = candidate ]; then
            TAG="ancestor-${GENERATION}-candidate"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Candidate already exists; do not overwrite it"; exit 1
            fi
            cp data/core-state.zip data/core-generation.zip
            gh release create "$TAG" data/core-generation.zip \
              --title "Ancestor Core ${GENERATION} immutable candidate" \
              --notes "Checkpoint of original-weight model after completed published-book paragraph reading and instruction. Evaluation and owner activation still required." \
              --prerelease
            echo "Training campaign complete: $TAG" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Automatically hand off unfinished campaign to another Actions session
        if: success()
        run: |
          set -euo pipefail
          PHASE="$(python -c 'import json;print(json.load(open("data/ancestor-state/generation.json"))["phase"])')"
          if [ "$PHASE" != candidate ] && [ "$AUTO_CONTINUE" = true ]; then
            gh workflow run ancestor-train.yml --ref main \
              -f generation="$GENERATION" \
              -f reading_passes="$READING_PASSES" \
              -f instruction_steps="$INSTRUCTION_STEPS" \
              -f session_seconds="$SESSION_SECONDS" \
              -f curriculum="$CURRICULUM" \
              -f parent_generation="$PARENT_GENERATION" \
              -f auto_continue=true
            echo "Queued continuation for $GENERATION from the newly published checkpoint" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload current-run progress diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ancestor-training-${{ github.run_id }}
          path: |
            data/ancestor-state/generation.json
            data/session-report.json
            data/package-report.json
          if-no-files-found: warn
          retention-days: 14
