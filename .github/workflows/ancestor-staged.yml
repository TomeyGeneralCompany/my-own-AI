name: Competency-locked autonomous Core learning

on:
  workflow_dispatch:
    inputs:
      parent_generation:
        description: 'Inherited immutable trained ancestor'
        required: true
        default: 'g0002'
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: staged-core-learning
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PARENT: ${{ inputs.parent_generation }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU neural training runtime
        run: |
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Restore stage ledger and learned weights
        run: |
          set -euo pipefail
          mkdir -p data/restore data/learning
          if gh release view ancestor-stage-progress >/dev/null 2>&1; then
            ASSET="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/ancestor-stage-progress" --jq '[.assets[] | select(.name | startswith("stage-state-"))] | sort_by(.created_at) | last | .name')"
            test -n "$ASSET" && test "$ASSET" != null
            gh release download ancestor-stage-progress --pattern "$ASSET" --dir data/restore
            python scripts/ancestor_staged.py unpack --archive "data/restore/$ASSET" --state data/learning
          else
            gh release download "ancestor-${PARENT}-candidate" --pattern core-generation.zip --dir data/restore
            python scripts/ancestor_core.py unpack --archive data/restore/core-generation.zip --state data/parent --generation "$PARENT"
            echo "PARENT_ARGS=--parent-state data/parent" >> "$GITHUB_ENV"
          fi
      - name: Train only currently unlocked stage, then independently examine model
        run: |
          set -euo pipefail
          python -u scripts/ancestor_staged.py train --repository . --state data/learning             --scratch data/session --parent-generation "$PARENT" ${PARENT_ARGS:-}             | tee data/stage-result.json
          python - <<'PY'
          import json,os
          ledger=json.load(open("data/learning/stage-ledger.json"))
          result=json.load(open("data/stage-result.json"))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("# Original Core competency gate\n\n")
              f.write("Current locked stage: **"+ledger["stage"]+"**\n\n")
              f.write("Book index: "+str(ledger["book_index"])+" / "+str(len(ledger["books"]))+"\n\n")
              f.write("Latest evidence: `"+json.dumps(result,ensure_ascii=False)[:1800]+"`\n")
          PY
      - name: Save integrity-verified state before handoff
        run: |
          set -euo pipefail
          python scripts/ancestor_staged.py pack --state data/learning --archive data/stage.zip
          if ! gh release view ancestor-stage-progress >/dev/null 2>&1; then
            gh release create ancestor-stage-progress --title "Competency-locked Core progress"               --notes "Original weights and controller ledger; competence gates never bypassed." --prerelease
          fi
          ASSET="stage-state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          cp data/stage.zip "data/$ASSET"
          gh release upload ancestor-stage-progress "data/$ASSET"
      - name: Mark review gate for auto-scheduler
        run: |
          set -euo pipefail
          STAGE="$(python -c 'import json;print(json.load(open("data/learning/stage-ledger.json"))["stage"])')"
          if [ "$STAGE" = awaiting_owner_review ]; then
            if ! gh release view ancestor-stage-review >/dev/null 2>&1; then
              gh release create ancestor-stage-review --title "Core requires owner synthesis review" \
                --notes "No automatic qualification or activation. See the last-exam.json artifact and stage ledger." --prerelease
            fi
          fi
      - name: Resume autonomously unless awaiting owner review
        run: |
          set -euo pipefail
          STAGE="$(python -c 'import json;print(json.load(open("data/learning/stage-ledger.json"))["stage"])')"
          if [ "$STAGE" != awaiting_owner_review ] && [ "$STAGE" != qualified ]; then
            gh workflow run ancestor-staged.yml --ref main -f parent_generation="$PARENT"
            echo "Queued next locked-stage learning session" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload examination and stage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-core-stage-${{ github.run_id }}
          path: |
            data/learning/stage-ledger.json
            data/learning/last-exam.json
            data/stage-result.json
          if-no-files-found: warn
          retention-days: 90
