name: Real checkpoint foundation continuation trial

on:
  pull_request:
    paths:
      - 'my_own_ai/language_training.py'
      - 'my_own_ai/english_acquisition.py'
      - 'my_own_ai/foundation_diagnostics.py'
      - 'scripts/ancestor_staged.py'
      - '.github/workflows/foundation-continuation-trial.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genuine-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original CPU runtime
        run: |
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Restore real production learning state as a local trial copy
        run: |
          set -euo pipefail
          mkdir -p data/recovery data/trial
          DIGEST="$(sha256sum published_books/manifest.json | cut -c1-12)"
          TAG="ancestor-stage-progress-${DIGEST}"
          ASSET="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '[.assets[] | select(.name | startswith("stage-state-"))] | sort_by(.created_at) | last | .name')"
          test -n "$ASSET" && test "$ASSET" != null
          gh release download "$TAG" --pattern "$ASSET" --dir data/recovery
          python scripts/ancestor_staged.py unpack --archive "data/recovery/$ASSET" --state data/trial
      - name: Run full-cycle adaptive foundation trial on actual learned weights
        run: |
          set -euo pipefail
          python -u scripts/ancestor_staged.py train --repository . --state data/trial \
            --scratch data/trial-scratch --parent-generation g0002 \
            --english-updates 8000 | tee data/trial-result.json
          python - <<'PY'
          import json,os
          result=json.load(open("data/trial-result.json"))
          evidence=json.load(open("data/trial/foundation-diagnostics.json"))
          assert result["curriculum_cycles"] >= 1
          assert evidence["curriculum_migration"], "Live checkpoint was not migrated"
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("# Actual production checkpoint continuation trial\n\n")
              f.write("Completed updates: "+str(result["completed_updates"])+"\n\n")
              f.write("Frozen unseen exam: "+str(result["fundamentals_correct"])+"/"+str(result["fundamentals_total"])+"\n\n")
              f.write("Training probe: "+str(result["known_probe_correct"])+"/16; validation probe: "+str(result["unseen_probe_correct"])+"/16\n\n")
              f.write("Training loss: "+str(result["last_training_loss"])+"; validation loss: "+str(result["validation_loss"])+"\n\n")
              f.write("No checkpoint was uploaded or merged. Competence gate unchanged.\n")
          PY
      - name: Publish trial diagnostics (not its learned weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-continuation-${{ github.run_id }}
          path: |
            data/trial-result.json
            data/trial/foundation-diagnostics.json
            data/trial/last-exam.json
          retention-days: 30
