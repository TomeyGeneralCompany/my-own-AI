name: Real checkpoint foundation continuation trial

on:
  pull_request:
    paths:
      - 'my_own_ai/english_mastery*.py'
      - 'my_own_ai/verified_memory.py'
      - 'my_own_ai/webster1913.py'
      - 'my_own_ai/language_training.py'
      - 'my_own_ai/english_acquisition.py'
      - 'my_own_ai/copy_curriculum.py'
      - 'my_own_ai/foundation_diagnostics.py'
      - 'scripts/ancestor_staged.py'
      - '.github/workflows/foundation-continuation-trial.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genuine-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original CPU runtime
        run: |
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Restore real production learning state as a local trial copy
        run: |
          set -euo pipefail
          mkdir -p data/recovery data/trial
          DIGEST="$(sha256sum published_books/manifest.json | cut -c1-12)"
          TAG="ancestor-stage-progress-${DIGEST}"
          ASSET="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '[.assets[] | select(.name | startswith("stage-state-"))] | sort_by(.created_at) | last | .name')"
          test -n "$ASSET" && test "$ASSET" != null
          gh release download "$TAG" --pattern "$ASSET" --dir data/recovery
          python scripts/ancestor_staged.py unpack --archive "data/recovery/$ASSET" --state data/trial
      - name: Run full-cycle continuation on actual learned weights
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, torch
          from pathlib import Path
          path=Path("data/trial/english.pt")
          if path.exists():
              saved=torch.load(path,map_location="cpu",weights_only=True)
              torch.save({k:saved[k] for k in ("state_dict","completed_steps","tokenizer_sha256")}, "data/recovery/english-before.pt")
              Path("data/recovery/memory-before.json").write_text(json.dumps(saved.get("verified_memory",{})))
              Path("data/recovery/mastery-before.json").write_text(json.dumps(saved.get("english_mastery",{})))
          PY
          python -u scripts/ancestor_staged.py train --repository . --state data/trial \
            --scratch data/trial-scratch --parent-generation g0002 \
            --english-updates 8000 | tee data/trial-result.json
          python - <<'PY'
          import json,os,torch
          from pathlib import Path
          result=json.load(open("data/trial-result.json"))
          if "substage" in result:
              evidence=json.load(open("data/trial/english-mastery-diagnostics.json"))
              checkpoint=torch.load(Path("data/trial/english.pt"),map_location="cpu",weights_only=True)
              before=torch.load(Path("data/recovery/english-before.pt"),map_location="cpu",weights_only=True)
              progress=checkpoint["english_mastery"]
              assert checkpoint["tokenizer_sha256"]==before["tokenizer_sha256"]
              assert result["session_updates"]>0 and result["session_tests"]>0
              assert checkpoint["completed_steps"]==before["completed_steps"]+result["session_updates"]==result["completed_updates"]
              assert checkpoint["state_dict"].keys()==before["state_dict"].keys()
              assert any(not torch.equal(v,before["state_dict"][k]) for k,v in checkpoint["state_dict"].items()), "No neural weight updates"
              assert progress["initial_step"]+progress["training_updates"]==checkpoint["completed_steps"]
              assert progress["passed_items"]==result["mastered"] and progress["cursor"]==result["cursor"]
              assert progress["cumulative_items"]==result["cumulative"]
              assert progress["phase"]==result["phase"] and len(progress["remediation"])==result["remediation_pending"]
              assert len(checkpoint["verified_memory"])==result["verified_memory_count"]
              old_memory=json.load(open("data/recovery/memory-before.json"))
              assert all(checkpoint["verified_memory"].get(k)==v for k,v in old_memory.items()), "Verified memory lost"
              assert evidence["completed_updates"]==result["completed_updates"]
              # A green continuation trial must demonstrate escape from the
              # live failed exercise, not merely changed weights or low loss.
              from my_own_ai.verified_memory import key, normalize
              previous=json.load(open("data/recovery/mastery-before.json"))
              failed=previous.get("last_answer") or {}
              if (previous.get("phase") in ("remediate","remedial_exam")
                  and failed.get("id","").startswith("dictionary-")
                  and failed.get("correct") is False):
                  memory_key=key(failed["question"])
                  if memory_key not in old_memory:
                      repaired=checkpoint["verified_memory"].get(memory_key)
                      assert repaired is not None, ("Real checkpoint remains blocked on "
                                                    +failed["id"]+": "+str(result["last_answer"]))
                      assert repaired["provenance"]=="neural", "Repair must be unaided"
                      assert normalize(repaired["answer"])==normalize(failed["expected"])
                      assert repaired["step"]>=before["completed_steps"]
              print("Held-out wording diagnostic:", progress.get("last_transfer"))
              if not progress["qualified"]:
                  assert result["stage"]=="english" and not result["passed"], "Competency gate bypassed"
              else:
                  assert progress["cumulative_items"]==progress["totals"] and not progress["remediation"]
              summary=("English mastery substage: "+result["substage"]+"\n\n"
                       +"Session updates: "+str(result["session_updates"])+"; tests: "+str(result["session_tests"])+"\n\n"
                       +"Mastered: "+str(result["mastered"])+"; verified memories: "+str(result["verified_memory_count"])+"\n\n"
                       +"Remediation pending: "+str(result["remediation_pending"])+"; last answer: "+str(result["last_answer"])+"\n\n"
                       +"Training loss: "+str(result["last_training_loss"])+" (not a mastery score)\n\n")
          elif "fundamentals_correct" in result:
              assert result["curriculum_cycles"] >= 1
              evidence=json.load(open("data/trial/foundation-diagnostics.json"))
              assert evidence["curriculum_migration"], "Live foundation checkpoint was not migrated"
              summary = ("Frozen unseen exam: "+str(result["fundamentals_correct"])+"/"+str(result["fundamentals_total"])+"\n\n"
                         +"Training probe: "+str(result["known_probe_correct"])+"/16; validation probe: "+str(result["unseen_probe_correct"])+"/16\n\n"
                         +"Training loss: "+str(result["last_training_loss"])+"; validation loss: "+str(result["validation_loss"])+"\n\n")
          else:
              assert result["curriculum_cycles"] >= 1
              assert "english_correct" in result, "Unexpected continuation stage"
              evidence=json.load(open("data/trial/comprehension-diagnostics.json"))
              checkpoint=torch.load(Path("data/trial/english.pt"),map_location="cpu",weights_only=True)
              assert checkpoint["curriculum_lineage"], "Live comprehension checkpoint was not migrated"
              assert checkpoint["curriculum_cursor"] == 0, "Incomplete instructional cycle"
              assert evidence["prior_comparable"] == 130, "Missing comparable exam evidence"
              assert evidence["retained"]+evidence["lost"]==evidence["previous_correct"]
              assert evidence["retained"]+evidence["gained"]==result["english_correct"]
              summary = ("Frozen comprehension exam: "+str(result["english_correct"])+"/"+str(result["english_total"])+"\n\n"
                         +"Retained: "+str(evidence["retained"])+"; lost: "+str(evidence["lost"])+"; gained: "+str(evidence["gained"])+"\n\n"
                         +"Validation loss: "+str(result["validation_loss"])+"\n\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("# Actual production checkpoint continuation trial\n\n")
              f.write("Completed updates: "+str(result["completed_updates"])+"\n\n")
              f.write(summary)
              f.write("No checkpoint was uploaded or merged. Competence gate unchanged.\n")
          PY
      - name: Publish trial diagnostics (not its learned weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-continuation-${{ github.run_id }}
          path: |
            data/trial-result.json
            data/trial/foundation-diagnostics.json
            data/trial/comprehension-diagnostics.json
            data/trial/last-exam.json
            data/trial/english-mastery-diagnostics.json
          retention-days: 30
