name: Core neural learning smoke test

on:
  workflow_dispatch:
    inputs:
      question:
        description: 'Ask the Core a question (experimental model)'
        required: false
        type: string
      evidence:
        description: 'Optional supporting source text for its answer'
        required: false
        type: string
  push:
    branches:
      - experiment/github-neural-training-benchmark
      - feature/ask-core-from-browser
    paths:
      - .github/workflows/core-neural-smoke.yml
      - scripts/github_neural_smoke.py

permissions:
  contents: read

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
      CORE_QUESTION: ${{ github.event_name == 'push' && 'What happens when a reporting channel is blocked?' || inputs.question || '' }}
      CORE_EVIDENCE: ${{ github.event_name == 'push' && 'A merchant depends on a clerk to relay changes in customer demand, but the clerk withholds the new report.' || inputs.evidence || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU-only neural runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Execute neural training and held-out counterfactual comparison
        run: python -u scripts/github_neural_smoke.py
      - name: Upload measured results and trained checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-neural-smoke-${{ github.run_id }}
          path: |
            data/hosted-neural-experiment/results.json
            data/hosted-neural-experiment/raw-generations.json
            data/hosted-neural-experiment/SUMMARY.md
            data/hosted-neural-experiment/question-response.json
            data/hosted-neural-experiment/untrained-base.pt
            data/hosted-neural-experiment/relational-brain.pt
          if-no-files-found: warn
          retention-days: 7
