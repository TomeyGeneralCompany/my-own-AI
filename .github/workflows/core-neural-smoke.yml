name: Ask the Core — original English model (public demo)

on:
  workflow_dispatch:
    inputs:
      question:
        description: 'Your question for the original English model (fresh synthetic training, NOT private books)'
        required: false
        type: string
      evidence:
        description: 'Optional evidence to present in the question (do not include private text)'
        required: false
        type: string
      training_steps:
        description: 'English instruction training updates (1–5000)'
        required: false
        default: '120'
        type: string
      full_gauntlet:
        description: 'Evaluate the complete 200-question English gauntlet'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  ask-english-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
      CORE_QUESTION: ${{ inputs.question || '' }}
      CORE_EVIDENCE: ${{ inputs.evidence || '' }}
      ENGLISH_INSTRUCTION_STEPS: ${{ inputs.training_steps || '120' }}
      ENGLISH_GAUNTLET_LIMIT: ${{ inputs.full_gauntlet && '200' || '14' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original CPU neural runtime
        run: |
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Ask the original English Core (never the legacy byte-level proposer)
        run: python -u scripts/github_english_trial.py
      - name: Upload English-model answer, provenance, metrics and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-english-answer-${{ github.run_id }}
          path: |
            data/hosted-english/SUMMARY.md
            data/hosted-english/metrics.json
            data/hosted-english/question-response.json
            data/hosted-english/gauntlet-results.json
            data/hosted-english/tokenizer.json
            data/hosted-english/pretrain.pt
            data/hosted-english/pretrain.best.pt
            data/hosted-english/english-core.pt
            data/hosted-english/english-core.best.pt
          if-no-files-found: warn
          retention-days: 7
