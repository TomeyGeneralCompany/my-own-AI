name: Ask the Core — persistent published-book neural model

on:
  workflow_dispatch:
    inputs:
      question:
        description: 'Question for the currently active ORIGINAL trained Core'
        required: true
        type: string
      evidence:
        description: 'Optional user-supplied evidence; shown to model but not verified'
        required: false
        type: string

permissions:
  contents: read

jobs:
  ask-persistent-ancestor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CORE_QUESTION: ${{ inputs.question }}
      CORE_EVIDENCE: ${{ inputs.evidence || '' }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original CPU inference runtime only
        run: |
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Resolve exact active checkpoint generation and verified SHA-256
        run: |
          set -euo pipefail
          mkdir -p data/model data/download
          if ! gh release view ancestor-active >/dev/null 2>&1; then
            echo "No active trained Core. Run published-book training, then explicitly activate a candidate." >&2
            exit 1
          fi
          gh release view ancestor-active --json body --jq .body > data/active.json
          python scripts/ancestor_core.py inspect-active --file data/active.json > data/pointer.json
          TAG="$(python -c 'import json;print(json.load(open("data/pointer.json"))["candidate_tag"])')"
          SHA="$(python -c 'import json;print(json.load(open("data/pointer.json"))["bundle_sha256"])')"
          GEN="$(python -c 'import json;print(json.load(open("data/pointer.json"))["generation"])')"
          gh release download "$TAG" --pattern core-generation.zip --dir data/download
          python scripts/ancestor_core.py unpack --archive data/download/core-generation.zip \
            --state data/model --generation "$GEN" --sha256 "$SHA"
      - name: Answer the question using the same persistent weights WITHOUT training
        run: |
          set -euo pipefail
          python -u scripts/ancestor_core.py ask --state data/model \
            --active data/active.json --output data/answer.json
          python - <<'PY'
          import html,json,os
          x=json.load(open("data/answer.json"))
          p=json.load(open("data/active.json"))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("# Ancestor Core — persistent inference\n\n")
              f.write("**Generation:** "+x["generation"]+" (status: "+p["status"]+")\n\n")
              f.write("**Checkpoint SHA-256:** "+x["checkpoint_sha256"]+"\n\n")
              f.write("**Training performed in this request:** No\n\n")
              f.write("## Question\n\n<pre>"+html.escape(x["question"])+"</pre>\n\n")
              f.write("## Actual model response\n\n<pre>"+html.escape(x["answer"]["answer"])+"</pre>\n\n")
              f.write("The output reflects trained weights, not an external pretrained model. English proficiency is not implied.\n")
          PY
      - name: Publish answer, checkpoint identity, and raw generated tokens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ancestor-persistent-answer-${{ github.run_id }}
          path: |
            data/answer.json
            data/active.json
          retention-days: 30
          if-no-files-found: warn
