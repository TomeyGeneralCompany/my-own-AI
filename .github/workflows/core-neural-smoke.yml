name: Ask the Core — current staged original neural model

on:
  workflow_dispatch:
    inputs:
      question:
        description: 'Question for the latest saved ORIGINAL Core (read-only preview)'
        required: true
        type: string
      evidence:
        description: 'Optional user-supplied evidence; shown to model but not verified'
        required: false
        type: string

permissions:
  contents: read

jobs:
  ask-persistent-ancestor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CORE_QUESTION: ${{ inputs.question }}
      CORE_EVIDENCE: ${{ inputs.evidence || '' }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original CPU inference runtime only
        run: |
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Restore latest integrity-verified staged checkpoint (read-only)
        run: |
          set -euo pipefail
          mkdir -p data/model data/download
          DIGEST="$(sha256sum published_books/manifest.json | cut -c1-12)"
          TAG="ancestor-stage-progress-${DIGEST}"
          ASSET="$(python scripts/stage_checkpoint_storage.py latest --repo "$GITHUB_REPOSITORY" --tag "$TAG")"
          gh release download "$TAG" --pattern "$ASSET" --dir data/download
          python scripts/ancestor_staged.py unpack --archive "data/download/$ASSET" --state data/model
          printf '%s\n' "$ASSET" > data/checkpoint-asset.txt
      - name: Answer the question using the same persistent weights WITHOUT training
        run: |
          set -euo pipefail
          python -u scripts/ask_modern_core.py --state data/model --output data/answer.json
          python - <<'PY'
          import html,json,os
          x=json.load(open("data/answer.json"))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("# Ancestor Core — persistent inference\n\n")
              f.write("**Parent generation:** "+x["generation"]+"; current stage: "+x["stage"]+"; qualified: "+str(x["qualified"])+"\n\n")
              f.write("**Checkpoint:** "+x["checkpoint"]+"; asset: "+open("data/checkpoint-asset.txt").read().strip()+"\n\n")
              f.write("**Checkpoint SHA-256:** "+x["checkpoint_sha256"]+"\n\n")
              f.write("**Training performed in this request:** No\n\n")
              f.write("## Question\n\n<pre>"+html.escape(x["question"])+"</pre>\n\n")
              f.write("## Actual model response\n\n<pre>"+html.escape(x["answer"]["answer"])+"</pre>\n\n")
              f.write("The output reflects trained weights, not an external pretrained model. English proficiency is not implied.\n")
          PY
      - name: Publish answer, checkpoint identity, and raw generated tokens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ancestor-persistent-answer-${{ github.run_id }}
          path: |
            data/answer.json
            data/checkpoint-asset.txt
          retention-days: 30
          if-no-files-found: warn
