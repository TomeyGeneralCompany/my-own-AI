name: PR18 real published-book Release to separate-runner inference

on:
  push:
    branches:
      - foundation/persistent-published-book-core

permissions:
  contents: write

concurrency:
  group: ancestor-pr18-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-real-model-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      sha: ${{ steps.publish.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU original-weight model
        run: |
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Read ALL eligible published book tokens; train minimal original assistant
        run: |
          set -euo pipefail
          python -u scripts/ancestor_core.py train --repository . \
            --generation g0001 --state data/integration-state --scratch data/integration-scratch \
            --passes 1 --instruction-steps 2 --max-reading-updates 20000 \
            --max-instruction-updates 2 --embed 16 --heads 4 --layers 1 \
            --context 512 --vocab 384 --batch 4 --threads 2
          python - <<'PY'
          import json
          p=json.load(open("data/integration-state/generation.json"))
          assert p["phase"]=="candidate",p
          assert p["completed_reading_passes"]==1,p
          assert p["completed_instruction_steps"]==2,p
          PY
      - name: Publish immutable REAL model bundle to GitHub Release
        id: publish
        run: |
          set -euo pipefail
          python scripts/ancestor_core.py pack --state data/integration-state --archive data/core-generation.zip
          TAG="ancestor-pr18-integration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SHA="$(sha256sum data/core-generation.zip | cut -d' ' -f1)"
          gh release create "$TAG" data/core-generation.zip \
            --target "$GITHUB_SHA" --prerelease \
            --title "PR18 published-book storage/inference integration" \
            --notes "Small original random-weight model trained on the approved published corpus, for cross-runner storage verification only. Not an active or qualified Core."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Published immutable candidate $TAG with SHA256 $SHA" >> "$GITHUB_STEP_SUMMARY"

  fresh-runner-load-and-ask:
    needs: create-real-model-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      BUNDLE_TAG: ${{ needs.create-real-model-release.outputs.tag }}
      BUNDLE_SHA: ${{ needs.create-real-model-release.outputs.sha }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference runtime
        run: |
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Download model from DIFFERENT runner and check all hashes
        run: |
          set -euo pipefail
          mkdir -p data/download
          gh release download "$BUNDLE_TAG" --pattern core-generation.zip --dir data/download
          python scripts/ancestor_core.py unpack --archive data/download/core-generation.zip \
            --state data/restored --generation g0001 --sha256 "$BUNDLE_SHA"
      - name: Assert asking does not reinitialize, retrain, or modify checkpoint
        run: |
          set -euo pipefail
          python scripts/ancestor_core.py ask --state data/restored \
            --question "Why does centralized founder approval slow an organization?" \
            --output data/answer-one.json --tokens 20
          python scripts/ancestor_core.py ask --state data/restored \
            --question "Why does centralized founder approval slow an organization?" \
            --output data/answer-two.json --tokens 20
          python - <<'PY'
          import json
          a=json.load(open("data/answer-one.json"))
          b=json.load(open("data/answer-two.json"))
          assert a["training_executed"] is False
          assert b["training_executed"] is False
          assert a["checkpoint_sha256"] == b["checkpoint_sha256"]
          assert a["answer"]["raw_token_ids"] == b["answer"]["raw_token_ids"]
          print("INTEGRATION PASS: same published-book-trained weights on a fresh runner, zero retraining")
          print("Unedited model generation:",a["generation"])
          print("Actual answer:",repr(a["answer"]["answer"]))
          PY
      - name: Store independent real neural generations and integrity record
        uses: actions/upload-artifact@v4
        with:
          name: pr18-cross-runner-real-book-inference-${{ github.run_id }}
          path: |
            data/answer-one.json
            data/answer-two.json
          retention-days: 30
