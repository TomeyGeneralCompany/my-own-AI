[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ancestor"
version = "0.1.0"
description = "Original locally trained neural model with owner-governed curriculum controller"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ancestor = "ancestor.cli:main"

[tool.setuptools.packages.find]
include = ["ancestor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
